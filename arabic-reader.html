<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قارئ النصوص العربية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eaf1f0; --surface:#ffffff; --ink:#12292c; --muted:#58706f;
  --line:#c5d5d3; --accent:#0e6a68; --accent-ink:#ffffff; --warn:#8a4b00;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1b1c; --surface:#162729; --ink:#e4f0ee; --muted:#93aeab;
    --line:#2b4244; --accent:#4fc3bd; --accent-ink:#062524; --warn:#e8b15d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1b1c; --surface:#162729; --ink:#e4f0ee; --muted:#93aeab;
  --line:#2b4244; --accent:#4fc3bd; --accent-ink:#062524; --warn:#e8b15d;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Naskh Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif;line-height:1.7}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.9rem;margin:8px 0 4px;font-weight:700}
.lead{margin:0 0 18px;color:var(--muted)}
textarea{width:100%;min-height:220px;resize:vertical;padding:14px;border:1.5px solid var(--line);
  border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:1.25rem;line-height:2}
textarea:focus,select:focus,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin:6px 2px 16px}
.row{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:16px}
label{display:block;font-size:.95rem;color:var(--muted);margin-bottom:2px}
select{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
input[type=range]{width:100%;accent-color:var(--accent)}
.sliders{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.val{color:var(--ink);font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:600;padding:12px 22px;border-radius:8px;cursor:pointer;
  border:1.5px solid var(--accent);background:transparent;color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);flex:1 1 140px}
button:disabled{opacity:.45;cursor:not-allowed}
#status{margin-top:16px;min-height:1.7em;color:var(--muted)}
#status.warn{color:var(--warn)}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
[hidden]{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.small{padding:6px 16px;font-size:.95rem}
.tabs{display:flex;gap:8px;margin:12px 0 18px;border-bottom:1.5px solid var(--line)}
.tabs button{border:none;border-radius:8px 8px 0 0;padding:10px 16px;color:var(--muted);background:transparent}
.tabs button[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
#p2 input[type=password],#model{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;margin-bottom:6px}
#img{width:100%;margin-bottom:10px;color:var(--ink)}
#prev{max-width:100%;max-height:260px;border-radius:8px;border:1.5px solid var(--line);display:block;margin:8px 0 14px}
.hint{font-size:.85rem;color:var(--muted);margin:0 0 12px}
#p2 .actions{margin:12px 0}
#out{min-height:180px}
dialog{border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:20px 24px;max-width:340px;font:inherit}
dialog::backdrop{background:rgba(0,0,0,.45)}
dl{margin:0 0 16px}
dt{color:var(--muted);font-size:.9rem}
dd{margin:0 0 10px;font-size:1.15rem;font-weight:600}
dd a{color:var(--accent);text-decoration:none}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>قارئ النصوص العربية</h1>
    <button id="aboutB" type="button" class="small">حول</button>
  </div>
  <div class="tabs" role="tablist">
    <button id="t1" role="tab" aria-selected="true" type="button">قراءة صوتية</button>
    <button id="t2" role="tab" aria-selected="false" type="button">صورة إلى نص</button>
  </div>
  <section id="p1">
  <p class="lead">الصق النص ثم اضغط «اقرأ النص» لتسمعه بصوت عربي.</p>

  <label for="text">النص</label>
  <textarea id="text" placeholder="الصق النص العربي هنا" dir="rtl"></textarea>
  <div class="meta"><span id="count">0 حرف</span><button id="clear" type="button" style="padding:2px 10px;font-size:.9rem">مسح</button></div>

  <div class="row">
    <div>
      <label for="voice">الصوت</label>
      <select id="voice"><option value="auto">تلقائي (عربي)</option></select>
    </div>
    <div class="sliders">
      <div><label for="rate">السرعة: <span class="val" id="rateV">1.0</span></label>
        <input id="rate" type="range" min="0.5" max="1.6" step="0.1" value="1"></div>
      <div><label for="pitch">درجة الصوت: <span class="val" id="pitchV">1.0</span></label>
        <input id="pitch" type="range" min="0.5" max="1.5" step="0.1" value="1"></div>
    </div>
  </div>

  <div class="actions">
    <button id="play" class="primary" type="button">اقرأ النص</button>
    <button id="pause" type="button" disabled>إيقاف مؤقت</button>
    <button id="stop" type="button" disabled>إيقاف</button>
  </div>
  <div class="bar" aria-hidden="true"><i id="prog"></i></div>
  <p id="status" role="status" aria-live="polite"></p>
  </section>

  <section id="p2" hidden>
    <p class="lead">اختر صورة فيها نص ليستخرجه Gemini، ثم أرسله إلى القارئ.</p>
    <label for="img">الصورة</label>
    <input id="img" type="file" accept="image/*">
    <img id="prev" alt="معاينة الصورة" hidden>
    <label for="key">مفتاح Gemini API</label>
    <input id="key" type="password" dir="ltr" autocomplete="off" placeholder="AIza...">
    <p class="hint">مجاني من aistudio.google.com/apikey دون بطاقة، ويُحفظ على هاتفك فقط.</p>
    <label for="model">النموذج</label>
    <input id="model" type="text" dir="ltr" value="gemini-3-flash-preview">
    <div class="actions"><button id="ocr" class="primary" type="button">استخرج النص</button></div>
    <label for="out">النص المستخرج</label>
    <textarea id="out" dir="rtl" placeholder="سيظهر النص هنا"></textarea>
    <div class="actions">
      <button id="copy" type="button">نسخ</button>
      <button id="toRead" type="button">أرسله إلى القارئ</button>
    </div>
    <p id="status2" role="status" aria-live="polite"></p>
  </section>

  <dialog id="about">
    <h2 style="margin-top:0">حول</h2>
    <dl>
      <dt>الاسم</dt><dd>عابر ياسين</dd>
      <dt>الدولة</dt><dd>الجزائر</dd>
      <dt>الهاتف</dt><dd dir="ltr"><a href="tel:05545957">05 54 59 57</a></dd>
    </dl>
    <button id="aboutC" type="button" class="small">إغلاق</button>
  </dialog>
</main>

<script>
(function(){
  var synth = window.speechSynthesis;
  var $ = function(id){return document.getElementById(id)};
  var text=$('text'), voiceSel=$('voice'), rate=$('rate'), pitch=$('pitch'),
      playB=$('play'), pauseB=$('pause'), stopB=$('stop'), status=$('status'), prog=$('prog');
  var voices=[], token=0, paused=false;

  function say(msg, warn){ status.textContent=msg; status.className=warn?'warn':''; }

  if(!synth || typeof SpeechSynthesisUtterance==='undefined'){
    say('هذا المتصفح لا يدعم القراءة الصوتية. جرّب Chrome أو Safari أو Edge.', true);
    playB.disabled=true; return;
  }

  function loadVoices(){
    var all = synth.getVoices();
    if(!all.length) return;
    var isAr = function(v){return /^ar|arab/i.test(v.lang) || /arab|عرب/i.test(v.name)};
    var ar = all.filter(isAr);
    voices = ar.concat(all.filter(function(v){return !isAr(v)}));
    var prev = voiceSel.value;
    voiceSel.innerHTML='';
    var a=document.createElement('option'); a.value='auto'; a.textContent='تلقائي (عربي)'; voiceSel.appendChild(a);
    voices.forEach(function(v,i){
      var o=document.createElement('option');
      o.value=i; o.textContent=v.name+' ('+v.lang+')';
      voiceSel.appendChild(o);
    });
    voiceSel.value = (prev && (prev==='auto' || voices[prev])) ? prev : (ar.length ? '0' : 'auto');
    if(!ar.length) say('لا يظهر صوت عربي في القائمة، لذلك اختر «تلقائي (عربي)» ثم اضغط «اقرأ النص» ليحاول المتصفح القراءة بالعربية.', true);
    else if(status.classList.contains('warn')) say('');
  }
  loadVoices();
  if('onvoiceschanged' in synth) synth.onvoiceschanged = loadVoices;
  setTimeout(loadVoices, 600);

  // Split into short chunks: long utterances get cut off in some browsers
  function chunks(t){
    var parts = t.replace(/\s+/g,' ').match(/[^.!?؟۔\n]+[.!?؟۔]*/g) || [];
    var out=[], cur='';
    parts.forEach(function(p){
      p=p.trim(); if(!p) return;
      if((cur+' '+p).length>160 && cur){ out.push(cur); cur=p; }
      else cur = cur ? cur+' '+p : p;
    });
    if(cur) out.push(cur);
    return out.flatMap(function(c){
      var r=[]; while(c.length>200){ var i=c.lastIndexOf(' ',200); if(i<50)i=200; r.push(c.slice(0,i)); c=c.slice(i).trim(); }
      if(c) r.push(c); return r;
    });
  }

  function reset(){
    paused=false; playB.disabled=false; pauseB.disabled=true; stopB.disabled=true;
    pauseB.textContent='إيقاف مؤقت';
  }

  function speak(){
    var t=text.value.trim();
    if(!t){ say('الصق نصًا أولًا.', true); text.focus(); return; }
    synth.cancel(); token++;
    var my=token, list=chunks(t), idx=0;
    playB.disabled=true; pauseB.disabled=false; stopB.disabled=false;
    say('جارٍ القراءة…'); prog.style.width='0';

    function next(){
      if(my!==token) return;
      if(idx>=list.length){ say('اكتملت القراءة.'); prog.style.width='100%'; reset(); return; }
      var u=new SpeechSynthesisUtterance(list[idx]);
      var v=voices[voiceSel.value];
      if(v){ u.voice=v; u.lang=v.lang; } else u.lang='ar-SA';
      u.rate=parseFloat(rate.value); u.pitch=parseFloat(pitch.value);
      u.onend=function(){ idx++; prog.style.width=(idx/list.length*100)+'%'; next(); };
      u.onerror=function(e){
        if(my!==token || e.error==='canceled' || e.error==='interrupted') return;
        say('تعذّرت القراءة ('+e.error+'). جرّب صوتًا آخر.', true); reset();
      };
      synth.speak(u);
    }
    next();
  }

  playB.onclick=speak;
  pauseB.onclick=function(){
    if(paused){ synth.resume(); paused=false; pauseB.textContent='إيقاف مؤقت'; say('جارٍ القراءة…'); }
    else { synth.pause(); paused=true; pauseB.textContent='استئناف'; say('متوقف مؤقتًا.'); }
  };
  stopB.onclick=function(){ token++; synth.cancel(); reset(); prog.style.width='0'; say('تم الإيقاف.'); };
  $('clear').onclick=function(){ text.value=''; upd(); text.focus(); };
  function upd(){ $('count').textContent=text.value.length+' حرف'; }
  text.addEventListener('input',upd);
  rate.oninput=function(){ $('rateV').textContent=parseFloat(rate.value).toFixed(1); };
  pitch.oninput=function(){ $('pitchV').textContent=parseFloat(pitch.value).toFixed(1); };
  window.addEventListener('pagehide',function(){ synth.cancel(); });
})();
</script>
<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var tabs=[['t1','p1'],['t2','p2']];
  function show(i){
    tabs.forEach(function(t,j){ $(t[0]).setAttribute('aria-selected', j===i); $(t[1]).hidden = j!==i; });
    if(i===1 && window.speechSynthesis) speechSynthesis.cancel();
  }
  $('t1').onclick=function(){show(0)};
  $('t2').onclick=function(){show(1)};

  var dlg=$('about');
  $('aboutB').onclick=function(){ if(dlg.showModal) dlg.showModal(); else dlg.setAttribute('open',''); };
  $('aboutC').onclick=function(){ if(dlg.close) dlg.close(); else dlg.removeAttribute('open'); };

  var st=$('status2');
  function say(m,w){ st.textContent=m; st.className=w?'warn':''; }
  try{
    $('key').value=localStorage.getItem('gkey')||'';
    $('model').value=localStorage.getItem('gmodel')||$('model').value;
  }catch(e){}

  var file=null;
  $('img').onchange=function(e){
    file=e.target.files[0]||null;
    var p=$('prev');
    if(file){ p.src=URL.createObjectURL(file); p.hidden=false; } else p.hidden=true;
  };

  function toB64(f){
    return new Promise(function(res,rej){
      var img=new Image(), url=URL.createObjectURL(f);
      img.onload=function(){
        var s=Math.min(1,2000/Math.max(img.width,img.height));
        var c=document.createElement('canvas');
        c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.9).split(',')[1]);
        URL.revokeObjectURL(url);
      };
      img.onerror=function(){ rej(new Error('تعذّرت قراءة الصورة')); };
      img.src=url;
    });
  }

  var PROMPT='استخرج كل النص الظاهر في هذه الصورة حرفيًا مع الحفاظ على لغته وترتيب أسطره. أعد النص فقط دون أي شرح أو تعليق.';

  async function call(model,key,b64){
    var url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(key);
    var r=await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:PROMPT},{inlineData:{mimeType:'image/jpeg',data:b64}}]}]})
    });
    var j={}; try{ j=await r.json(); }catch(e){}
    if(!r.ok){
      var err=new Error((j.error&&j.error.message)||('HTTP '+r.status));
      err.status=r.status; throw err;
    }
    var parts=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
    return parts.map(function(p){return p.text||''}).join('').trim();
  }

  $('ocr').onclick=async function(){
    var key=$('key').value.trim(), model=$('model').value.trim();
    if(!file){ say('اختر صورة أولًا.',true); return; }
    if(!key){ say('أدخل مفتاح Gemini API.',true); return; }
    try{ localStorage.setItem('gkey',key); localStorage.setItem('gmodel',model); }catch(e){}
    var btn=$('ocr'); btn.disabled=true; say('جارٍ استخراج النص…');
    var list=[model,'gemini-3.5-flash','gemini-3.1-flash-lite'].filter(function(m,i,a){return m && a.indexOf(m)===i;});
    try{
      var b64=await toB64(file), text='', used='', lastErr=null;
      for(var i=0;i<list.length;i++){
        try{ text=await call(list[i],key,b64); used=list[i]; lastErr=null; break; }
        catch(e){ lastErr=e; if(e.status!==404) break; }
      }
      if(lastErr) throw lastErr;
      if(!text){ say('لم يُعثر على نص في الصورة.',true); }
      else {
        $('out').value=text;
        if(used!==model){ $('model').value=used; try{localStorage.setItem('gmodel',used);}catch(e){} }
        say('تم استخراج النص.');
      }
    }catch(e){
      var m=e.message||'';
      if(e.status===400 && /API key/i.test(m)) m='المفتاح غير صالح. تحقق منه.';
      else if(e.status===403) m='المفتاح مرفوض أو غير مفعّل. تحقق منه.';
      else if(e.status===429) m='تجاوزت الحد المجاني مؤقتًا. انتظر دقيقة وأعد المحاولة.';
      else if(e.status===404) m='النموذج غير متاح. غيّر اسمه في خانة «النموذج».';
      else if(e instanceof TypeError) m='تعذّر الاتصال. تأكد من الإنترنت، وافتح الملف من Chrome.';
      say(m,true);
    }
    btn.disabled=false;
  };

  $('copy').onclick=function(){
    var o=$('out');
    if(!o.value){ say('لا يوجد نص لنسخه.',true); return; }
    var done=function(){ say('تم النسخ.'); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(o.value).then(done,function(){ o.select(); document.execCommand('copy'); done(); });
    } else { o.select(); document.execCommand('copy'); done(); }
  };

  $('toRead').onclick=function(){
    var o=$('out');
    if(!o.value.trim()){ say('لا يوجد نص لإرساله.',true); return; }
    var t=$('text'); t.value=o.value;
    t.dispatchEvent(new Event('input'));
    show(0); t.scrollIntoView({block:'center'});
  };
})();
</script>
</body>
</html>
